<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubSpazio — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 70% -10%, #16213a 0%, #0b0f17 60%);
    color: #c9d4e3; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 24rem; text-align: center; padding: 2rem; }
  h1 { color: #7fd1ff; font-size: 1.4rem; }
  button { margin-top: 1rem; background: #7fd1ff; color: #06121c; border: 0;
    border-radius: 10px; padding: .6rem 1.1rem; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sei offline</h1>
    <p>SubSpazio è un gioco in tempo reale e richiede una connessione. Il guscio dell'app è disponibile, ma la galassia no.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
