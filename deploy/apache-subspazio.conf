# SubSpazio — configurazione Apache opzionale (hardening + URL puliti).
#
# Installazione / aggiornamento:
#   sudo cp /data/html/subspazio/deploy/apache-subspazio.conf /etc/apache2/conf-available/subspazio.conf
#   sudo a2enconf subspazio
#   sudo systemctl reload apache2
#
# Poi, per togliere "/index.php" dagli URL, impostare
#   'app' => [ 'pretty_urls' => true ]
# in /data/subspazio-config/config.php
#
# NB: il DocumentRoot e' /var/www/html (symlink a /data/html). Apache usa il
# percorso col symlink NON risolto per <Directory>, quindi qui si usa
# /var/www/html/subspazio; per <DirectoryMatch> si usa un pattern che funziona
# con entrambe le forme del percorso.

<Directory /var/www/html/subspazio>
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /subspazio/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

# Nega l'accesso web alle directory non pubbliche (qualsiasi prefisso di percorso).
<DirectoryMatch "/subspazio/(src|db|bin|config|deploy|storage|views|tests)(/|$)">
    Require all denied
</DirectoryMatch>

# Nega file sensibili sparsi.
<FilesMatch "(^\.|\.(md|sql|lock|log|dist|example)$|composer\.(json|lock))">
    Require all denied
</FilesMatch>
